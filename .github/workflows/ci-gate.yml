name: CI Gate

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'apps/buras/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - 'scripts/**'
      - 'docs/**'
      - 'docs/openapi.yaml'
      - '.github/workflows/**'
      - 'release-please-config.json'
      - '.release-please-manifest.json'
  push:
    branches: [main, develop]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'apps/buras/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - 'scripts/**'
      - 'docs/**'
      - 'docs/openapi.yaml'
      - '.github/workflows/**'
      - 'release-please-config.json'
      - '.release-please-manifest.json'

permissions:
  contents: read

concurrency:
  group: ci-gate-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect impacted applications
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      buras: ${{ steps.filter.outputs.buras }}
      architecture: ${{ steps.filter.outputs.architecture }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'docker/**'
              - 'docker-compose.yml'
              - 'docker-compose.prod.yml'
              - 'docs/openapi.yaml'
              - '.github/workflows/ci-api.yml'
              - '.github/workflows/ci-gate.yml'
              - 'release-please-config.json'
              - '.release-please-manifest.json'
            buras:
              - 'apps/buras/**'
              - 'docker/buras/**'
              - 'docker-compose.yml'
              - 'docker-compose.prod.yml'
              - '.github/workflows/ci-buras.yml'
              - '.github/workflows/ci-gate.yml'
              - 'release-please-config.json'
              - '.release-please-manifest.json'
            web:
              - 'apps/web/**'
              - 'docker/**'
              - 'docker-compose.yml'
              - 'docker-compose.prod.yml'
              - 'docs/openapi.yaml'
              - '.github/workflows/ci-web.yml'
              - '.github/workflows/ci-gate.yml'
              - 'release-please-config.json'
              - '.release-please-manifest.json'
            architecture:
              - 'apps/api/**'
              - 'apps/web/**'
              - 'apps/buras/**'
              - 'docker/**'
              - 'docker-compose.yml'
              - 'docker-compose.prod.yml'
              - 'docs/architecture/**'
              - 'scripts/check-architecture-diagrams.sh'
              - '.github/workflows/**'

  api:
    name: Required API CI
    needs: changes
    if: needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/ci-api.yml
    secrets: inherit

  web:
    name: Required Web CI
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/ci-web.yml
    secrets: inherit

  buras:
    name: Required Buras CI
    needs: changes
    if: needs.changes.outputs.buras == 'true'
    uses: ./.github/workflows/ci-buras.yml
    secrets: inherit

  architecture:
    name: Required architecture diagrams CI
    needs: changes
    if: needs.changes.outputs.architecture == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y graphviz

      - name: Download PlantUML
        env:
          PLANTUML_VERSION: 1.2025.2
        run: |
          mkdir -p "$RUNNER_TEMP/plantuml"
          curl -fL "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar" \
            -o "$RUNNER_TEMP/plantuml/plantuml-${PLANTUML_VERSION}.jar"
          echo "PLANTUML_JAR=$RUNNER_TEMP/plantuml/plantuml-${PLANTUML_VERSION}.jar" >> "$GITHUB_ENV"

      - name: Render and verify every architecture diagram
        run: scripts/check-architecture-diagrams.sh

  result:
    name: CI Gate result
    if: always()
    needs: [changes, api, web, buras, architecture]
    runs-on: ubuntu-latest
    steps:
      - name: Validate required pipelines
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          API_NEEDED: ${{ needs.changes.outputs.api }}
          WEB_NEEDED: ${{ needs.changes.outputs.web }}
          BURAS_NEEDED: ${{ needs.changes.outputs.buras }}
          ARCHITECTURE_NEEDED: ${{ needs.changes.outputs.architecture }}
          API_RESULT: ${{ needs.api.result }}
          WEB_RESULT: ${{ needs.web.result }}
          BURAS_RESULT: ${{ needs.buras.result }}
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change detection failed."
            exit 1
          fi
          if [ "$API_NEEDED" = "true" ] && [ "$API_RESULT" != "success" ]; then
            echo "Required API CI did not pass ($API_RESULT)."
            exit 1
          fi
          if [ "$WEB_NEEDED" = "true" ] && [ "$WEB_RESULT" != "success" ]; then
            echo "Required Web CI did not pass ($WEB_RESULT)."
            exit 1
          fi
          if [ "$BURAS_NEEDED" = "true" ] && [ "$BURAS_RESULT" != "success" ]; then
            echo "Required Buras CI did not pass ($BURAS_RESULT)."
            exit 1
          fi
          if [ "$ARCHITECTURE_NEEDED" = "true" ] && [ "$ARCHITECTURE_RESULT" != "success" ]; then
            echo "Required architecture diagrams CI did not pass ($ARCHITECTURE_RESULT)."
            exit 1
          fi
          echo "All required CI pipelines passed or were not needed."

  deploy-production:
    name: Deploy production to VPS
    needs: [api, web, buras, result]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.result.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS host key
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" >> ~/.ssh/known_hosts

      - name: Update and restart production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
        run: |
          echo "Requested production SHA: $GITHUB_SHA"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" <<EOF
          set -e
          cd "$VPS_APP_PATH"
          git fetch origin main
          git switch main
          git pull --ff-only origin main
          bash scripts/deploy-production.sh "$GITHUB_SHA"
          EOF

      - name: Verify production health
        env:
          HEALTH_URL: https://api.oiai.stylbandeira.tech/api/health
        run: |
          response=$(curl --silent --show-error --max-time 5 \
            --retry 10 --retry-delay 3 --retry-max-time 60 --retry-all-errors \
            --write-out '\n%{http_code}' "$HEALTH_URL")
          http_status="${response##*$'\n'}"
          body="${response%$'\n'*}"

          if [ "$http_status" != "200" ] || ! jq -e '
            .status == "ok" and
            .checks.application == "ok" and
            .checks.database == "ok" and
            .checks.queue == "ok" and
            .checks.meilisearch == "ok"
          ' <<< "$body"; then
            echo "Production health check failed (HTTP $http_status)."
            exit 1
          fi
          echo "Production health passed for SHA $GITHUB_SHA"
