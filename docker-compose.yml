services:
    app:
        build:
            context: .
            dockerfile: docker/api/Dockerfile
        container_name: oiai-app
        ports:
            - "8001:8001"
        volumes:
            - ./apps/api:/var/www/html
        working_dir: /var/www/html
        entrypoint: []
        command: >
            sh -c "
            php artisan storage:link --force &&
            php artisan config:clear &&
            php artisan serve --host=0.0.0.0 --port=8001
            "
        environment:
            APACHE_RUN_USER: www-data
            APACHE_RUN_GROUP: www-data
            FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
            MEILISEARCH_HOST: http://meilisearch:7700
            BURAS_URL: http://buras:8085
            BURAS_INGEST_TOKEN: ${BURAS_INGEST_TOKEN:-}
            DB_HOST: db
            DB_USERNAME: oiai
            DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
        depends_on:
            db:
                condition: service_healthy

    queue:
        build:
            context: .
            dockerfile: docker/api/Dockerfile
        container_name: oiai-queue
        working_dir: /var/www/html
        user: "www-data"
        entrypoint: []
        command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
        volumes:
            - ./apps/api:/var/www/html
        environment:
            MEILISEARCH_HOST: http://meilisearch:7700
            BURAS_URL: http://buras:8085
            BURAS_INGEST_TOKEN: ${BURAS_INGEST_TOKEN:-}
            DB_HOST: db
            DB_USERNAME: oiai
            DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
        depends_on:
            db:
                condition: service_healthy

    scheduler:
        build:
            context: .
            dockerfile: docker/api/Dockerfile
        container_name: oiai-scheduler
        working_dir: /var/www/html
        user: "www-data"
        entrypoint: []
        command: php artisan schedule:work
        volumes:
            - ./apps/api:/var/www/html
        environment:
            MEILISEARCH_HOST: http://meilisearch:7700
            BURAS_URL: http://buras:8085
            BURAS_INGEST_TOKEN: ${BURAS_INGEST_TOKEN:-}
            DB_HOST: db
            DB_USERNAME: oiai
            DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
        depends_on:
            db:
                condition: service_healthy

    oiai-front:
        build:
            context: ./apps/web
            dockerfile: Dockerfile
        container_name: oiai-front
        ports:
            - "3000:3000"
        volumes:
            - ./apps/web:/app
            - /app/node_modules
        working_dir: /app
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        environment:
            CHOKIDAR_USEPOLLING: "true"
            WATCHPACK_POLLING: "true"
            NODE_ENV: development
        depends_on:
            - app
        stdin_open: true
        tty: true

    buras:
        profiles: [buras]
        build:
            context: ./apps/buras
            dockerfile: ../../docker/buras/Dockerfile
        ports:
            - "127.0.0.1:${BURAS_PORT:-8002}:8085"
        environment:
            BURAS_INGEST_TOKEN: ${BURAS_INGEST_TOKEN:-}
            BURAS_ADMIN_TOKEN: ${BURAS_ADMIN_TOKEN:-}
            BURAS_DB_PATH: /data/buras.sqlite
            BURAS_PASSIVE_ENABLED: ${BURAS_PASSIVE_ENABLED:-true}
            BURAS_ACTIVE_ENABLED: ${BURAS_ACTIVE_ENABLED:-true}
            BURAS_PROBE_URL: http://app:8001/api/health
            BURAS_PROBE_ENVIRONMENT: local
        volumes:
            - buras_data:/data
        depends_on:
            - app

    db:
        image: mysql:5.7
        container_name: oiai-db
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
            MYSQL_DATABASE: oiai
            MYSQL_USER: ${DB_USERNAME:-oiai}
            MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
        volumes:
            - dbdata:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
            interval: 5s
            timeout: 5s
            retries: 20

    meilisearch:
        image: getmeili/meilisearch:v1.15
        container_name: oiai-meilisearch
        env_file:
            - ./apps/api/.env
        environment:
            MEILI_EXPERIMENTAL_ENABLE_METRICS: "true"
        command: sh -c 'exec meilisearch --master-key "$$MEILISEARCH_KEY"'
        ports:
            - "7700:7700"
        volumes:
            - meilisearch_data:/meili_data

    mailhog:
        image: mailhog/mailhog
        container_name: mailhog
        ports:
            - "1025:1025"
            - "8025:8025"

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: phpmyadmin
        environment:
            PMA_HOST: db
            PMA_USER: root
            PMA_PASSWORD: root
        ports:
            - "8080:80"
        depends_on:
            - db

volumes:
    dbdata:
    meilisearch_data:
    buras_data:
