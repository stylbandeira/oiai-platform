services:
    app:
        build:
            context: .
            dockerfile: docker/api/Dockerfile
        container_name: oiai-app
        ports:
            - "8001:8001"
        volumes:
            - ./apps/api:/var/www/html
            - api_vendor:/var/www/html/vendor
        working_dir: /var/www/html
        entrypoint: []
        command: >
            sh -c "
            php artisan config:clear &&
            php artisan serve --host=0.0.0.0 --port=8001
            "
        environment:
            APACHE_RUN_USER: www-data
            APACHE_RUN_GROUP: www-data
            FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
        depends_on:
            db:
                condition: service_healthy

    queue:
        build:
            context: .
            dockerfile: docker/api/Dockerfile
        container_name: oiai-queue
        working_dir: /var/www/html
        entrypoint: []
        command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
        volumes:
            - ./apps/api:/var/www/html
        depends_on:
            db:
                condition: service_healthy

    scheduler:
        build:
            context: .
            dockerfile: docker/api/Dockerfile
        container_name: oiai-scheduler
        working_dir: /var/www/html
        entrypoint: []
        command: php artisan schedule:work
        volumes:
            - ./apps/api:/var/www/html
        depends_on:
            db:
                condition: service_healthy

    oiai-front:
        build:
            context: ./apps/web
            dockerfile: Dockerfile
        container_name: oiai-front
        ports:
            - "3000:3000"
        volumes:
            - ./apps/web:/app
            - /app/node_modules
        working_dir: /app
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        environment:
            CHOKIDAR_USEPOLLING: "true"
            WATCHPACK_POLLING: "true"
            NODE_ENV: development
        depends_on:
            - app
        stdin_open: true
        tty: true

    db:
        image: mysql:5.7
        container_name: oiai-db
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: oiai
            MYSQL_PASSWORD: root
        volumes:
            - dbdata:/var/lib/mysql
        ports:
            - "3306:3306"
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
            interval: 5s
            timeout: 5s
            retries: 20

    mailhog:
        image: mailhog/mailhog
        container_name: mailhog
        ports:
            - "1025:1025"
            - "8025:8025"

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: phpmyadmin
        environment:
            PMA_HOST: db
            PMA_USER: root
            PMA_PASSWORD: root
        ports:
            - "8080:80"
        depends_on:
            - db

volumes:
    dbdata:
    api_vendor:
