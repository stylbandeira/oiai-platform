services:
    app:
        labels:
            org.opencontainers.image.revision: ${DEPLOY_SHA:?DEPLOY_SHA is required}
        build:
            context: .
            dockerfile: docker/api/Dockerfile.prod
        restart: unless-stopped
        env_file:
            - ${API_ENV_FILE:-./apps/api/.env.prod}
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            MEILISEARCH_HOST: http://meilisearch:7700
            BURAS_URL: http://buras:8085
            BURAS_INGEST_TOKEN: ${BURAS_INGEST_TOKEN:-}
            BURAS_ADMIN_TOKEN: ${BURAS_ADMIN_TOKEN:-}
        volumes:
            - api_storage_prod:/var/www/html/storage
        depends_on:
            db:
                condition: service_healthy
            meilisearch:
                condition: service_started

    api-web:
        labels:
            org.opencontainers.image.revision: ${DEPLOY_SHA:?DEPLOY_SHA is required}
        build:
            context: .
            dockerfile: docker/api/Dockerfile.nginx.prod
        restart: unless-stopped
        ports:
            - "127.0.0.1:8001:80"
        volumes:
            - api_storage_prod:/var/www/html/storage:ro
        depends_on:
            - app

    queue:
        labels:
            org.opencontainers.image.revision: ${DEPLOY_SHA:?DEPLOY_SHA is required}
        build:
            context: .
            dockerfile: docker/api/Dockerfile.prod
        restart: unless-stopped
        env_file:
            - ${API_ENV_FILE:-./apps/api/.env.prod}
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            MEILISEARCH_HOST: http://meilisearch:7700
            BURAS_URL: http://buras:8085
            BURAS_INGEST_TOKEN: ${BURAS_INGEST_TOKEN:-}
        command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
        user: "www-data"
        volumes:
            - api_storage_prod:/var/www/html/storage
        depends_on:
            db:
                condition: service_healthy

    scheduler:
        labels:
            org.opencontainers.image.revision: ${DEPLOY_SHA:?DEPLOY_SHA is required}
        build:
            context: .
            dockerfile: docker/api/Dockerfile.prod
        restart: unless-stopped
        env_file:
            - ${API_ENV_FILE:-./apps/api/.env.prod}
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            BURAS_URL: http://buras:8085
            BURAS_INGEST_TOKEN: ${BURAS_INGEST_TOKEN:-}
        command: php artisan schedule:work
        user: "www-data"
        depends_on:
            db:
                condition: service_healthy

    web:
        labels:
            org.opencontainers.image.revision: ${DEPLOY_SHA:?DEPLOY_SHA is required}
        build:
            context: ./apps/web
            dockerfile: Dockerfile.prod
            args:
                VITE_API_URL: ${VITE_API_URL:-}
        restart: unless-stopped
        ports:
            - "127.0.0.1:${WEB_PORT:-3000}:80"
        depends_on:
            - app

    buras:
        profiles: [buras]
        labels:
            org.opencontainers.image.revision: ${DEPLOY_SHA:?DEPLOY_SHA is required}
        build:
            context: ./apps/buras
            dockerfile: ../../docker/buras/Dockerfile
        restart: unless-stopped
        environment:
            BURAS_INGEST_TOKEN: ${BURAS_INGEST_TOKEN:-}
            BURAS_ADMIN_TOKEN: ${BURAS_ADMIN_TOKEN:-}
            BURAS_DB_PATH: /data/buras.sqlite
            BURAS_PASSIVE_ENABLED: ${BURAS_PASSIVE_ENABLED:-true}
            BURAS_ACTIVE_ENABLED: ${BURAS_ACTIVE_ENABLED:-false}
            BURAS_PROBE_URL: ${BURAS_PROBE_URL:-}
            BURAS_PROBE_ENVIRONMENT: production
            BURAS_ALERT_WEBHOOK_URL: ${BURAS_ALERT_WEBHOOK_URL:-}
            BURAS_ALERT_FAILURES: ${BURAS_ALERT_FAILURES:-5}
            BURAS_ALERT_WINDOW: ${BURAS_ALERT_WINDOW:-1h}
            BURAS_ALERT_COOLDOWN: ${BURAS_ALERT_COOLDOWN:-1h}
            BURAS_RETENTION_DAYS: ${BURAS_RETENTION_DAYS:-30}
        ports:
            - "127.0.0.1:${BURAS_PORT:-8002}:8085"
        volumes:
            - buras_data:/data

    db:
        image: mysql:8.0
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
            MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
            MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
        volumes:
            - dbdata_prod:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
            interval: 10s
            timeout: 5s
            retries: 10

    meilisearch:
        image: getmeili/meilisearch:v1.15
        restart: unless-stopped
        environment:
            MEILI_MASTER_KEY: ${MEILISEARCH_KEY:?MEILISEARCH_KEY is required}
        volumes:
            - meilisearch_data_prod:/meili_data

volumes:
    dbdata_prod:
    meilisearch_data_prod:
    api_storage_prod:
    buras_data:
