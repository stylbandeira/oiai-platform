services:
    app:
        build:
            context: .
            dockerfile: docker/api/Dockerfile.prod
        restart: unless-stopped
        env_file:
            - ${API_ENV_FILE:-./apps/api/.env.prod}
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            MEILISEARCH_HOST: http://meilisearch:7700
        volumes:
            - api_storage_prod:/var/www/html/storage
        depends_on:
            db:
                condition: service_healthy
            meilisearch:
                condition: service_started

    api-web:
        build:
            context: .
            dockerfile: docker/api/Dockerfile.nginx.prod
        restart: unless-stopped
        ports:
            - "127.0.0.1:8001:80"
        volumes:
            - api_storage_prod:/var/www/html/storage:ro
        depends_on:
            - app

    queue:
        build:
            context: .
            dockerfile: docker/api/Dockerfile.prod
        restart: unless-stopped
        env_file:
            - ${API_ENV_FILE:-./apps/api/.env.prod}
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            MEILISEARCH_HOST: http://meilisearch:7700
        command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
        depends_on:
            db:
                condition: service_healthy

    scheduler:
        build:
            context: .
            dockerfile: docker/api/Dockerfile.prod
        restart: unless-stopped
        env_file:
            - ${API_ENV_FILE:-./apps/api/.env.prod}
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
        command: php artisan schedule:work
        depends_on:
            db:
                condition: service_healthy

    web:
        build:
            context: ./apps/web
            dockerfile: Dockerfile.prod
            args:
                VITE_API_URL: ${VITE_API_URL:-}
        restart: unless-stopped
        ports:
            - "127.0.0.1:${WEB_PORT:-3000}:80"
        depends_on:
            - app

    db:
        image: mysql:8.0
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
            MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
            MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
        volumes:
            - dbdata_prod:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
            interval: 10s
            timeout: 5s
            retries: 10

    meilisearch:
        image: getmeili/meilisearch:v1.15
        restart: unless-stopped
        environment:
            MEILI_MASTER_KEY: ${MEILISEARCH_KEY:?MEILISEARCH_KEY is required}
        volumes:
            - meilisearch_data_prod:/meili_data

volumes:
    dbdata_prod:
    meilisearch_data_prod:
    api_storage_prod:
